<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Launcher</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236d7df6'/><circle cx='50' cy='50' r='26' fill='none' stroke='%23151925' stroke-width='12' stroke-linecap='round'/></svg>" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    background: #0f121d;
    color: #e7e9ff;
    display: grid;
    place-items: center;
    min-height: 100vh;
    text-align: center;
    padding: 24px;
  }
  .splash-mark {
    width: 72px; height: 72px;
    margin: 0 auto 20px;
    border-radius: 22px;
    background: linear-gradient(135deg, #6d7df6, #2dd4bf);
    display: grid; place-items: center;
    font-size: 34px; font-weight: 800; color: #0f121d;
  }
  h1 { font-size: 30px; margin-bottom: 8px; }
  p { color: #8b90c4; margin-bottom: 28px; }
  a.splash-btn {
    display: inline-block;
    padding: 12px 32px;
    border-radius: 999px;
    background: #6d7df6;
    color: #fff;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  a.splash-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(109, 125, 246, 0.35); }
</style>
</head>
<body>
  <main>
    <div class="splash-mark">L</div>
    <h1>Launcher</h1>
    <p>Your apps and links, in one place.</p>
    <a class="splash-btn" href="/app.html">Open</a>
  </main>
</body>
</html>
