<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crestview School District - Student Portal</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230f4c81'/><path d='M50 18 84 42H66v28H34V42H16Z' fill='%23f2b807'/><path d='M50 28l20 12v-6h8v10l10 5v3H12v-3l38-21Z' fill='%23fff'/></svg>" />
</head>
<body>
  <header class="navbar">
    <a href="/" class="logo">
      <span class="logo-mark">CS</span>
      <span class="logo-text">Crestview <span>Portal</span></span>
    </a>
    <nav class="nav-links">
      <a href="/" class="nav-link active">Home</a>
      <a href="#library" class="nav-link">Library</a>
    </nav>
    <form class="search-bar" id="nav-form">
      <input type="text" id="nav-address" placeholder="Search the web or enter a URL..." autocomplete="off" spellcheck="false" />
      <select id="nav-engine" aria-label="Search engine">
        <option value="https://www.google.com/search?q=%s">Google</option>
        <option value="https://duckduckgo.com/?q=%s" selected>DuckDuckGo</option>
        <option value="https://www.bing.com/search?q=%s">Bing</option>
        <option value="https://www.youtube.com/results?search_query=%s">YouTube</option>
      </select>
      <button type="submit" class="search-btn">Go</button>
    </form>
    <button class="gear-btn" id="btn-settings" title="Menu" aria-label="Menu">&#9881;</button>
  </header>

  <main id="home-view">
    <section class="hero">
      <h1>Explore the Web</h1>
      <p>Search and browse from one place.</p>
      <form class="hero-search" id="hero-form">
        <input type="text" id="hero-address" placeholder="Search Google or type a URL..." autocomplete="off" spellcheck="false" />
        <button type="submit" class="hero-btn">Search</button>
      </form>
      <div class="quick-links">
        <a href="#" data-url="https://www.youtube.com">YouTube</a>
        <a href="#" data-url="https://www.google.com">Google</a>
        <a href="#" data-url="https://www.reddit.com">Reddit</a>
        <a href="#" data-url="https://open.spotify.com">Spotify</a>
      </div>
    </section>

    <section class="library-section" id="library">
      <h2>Library</h2>
      <p class="section-sub">All apps run right in your browser. No downloads.</p>
      <div class="library-grid" id="library-grid"></div>
    </section>
  </main>

  <main id="browser-view" class="hidden">
    <div class="browser-toolbar">
      <button class="browser-btn" id="btn-back" title="Back">&#8592;</button>
      <button class="browser-btn" id="btn-forward" title="Forward">&#8594;</button>
      <button class="browser-btn" id="btn-reload" title="Reload">&#8635;</button>
      <button class="browser-btn" id="btn-home" title="Home">&#8962;</button>
      <form class="browser-address" id="browser-form">
        <input type="text" id="browser-address-input" placeholder="Search the web or enter a URL..." autocomplete="off" spellcheck="false" />
      </form>
      <button class="browser-btn" id="btn-exit" title="Close browser">&#10005;</button>
    </div>
    <iframe id="frame" class="browser-frame" title="Browser"></iframe>
  </main>

  <div id="settings-modal" class="hidden">
    <div class="settings-panel">
      <h2>Settings</h2>
      <div class="settings-row">
        <label for="set-engine">Search engine</label>
        <select id="set-engine">
          <option value="google">Google</option>
          <option value="ddg">DuckDuckGo</option>
          <option value="bing">Bing</option>
          <option value="yt">YouTube</option>
        </select>
      </div>
      <div class="settings-row">
        <label for="set-home">Home page</label>
        <select id="set-home">
          <option value="https://www.google.com">Google</option>
          <option value="https://www.youtube.com">YouTube</option>
          <option value="https://githubgames.gitlab.io/">Activity Hub</option>
        </select>
      </div>
      <div class="settings-row">
        <label for="set-transport">Connection mode</label>
        <select id="set-transport">
          <option value="auto">Auto</option>
          <option value="wisp">Fast</option>
          <option value="bare">Compatible</option>
        </select>
      </div>
      <div class="settings-row">
        <label for="set-cloak">Tab name</label>
        <select id="set-cloak">
          <option value="default">Student Portal</option>
          <option value="docs">Google Docs</option>
          <option value="google">Google Search</option>
        </select>
      </div>
      <div class="settings-actions">
        <button class="settings-btn" id="btn-aboutblank">Open blank tab</button>
        <button class="settings-btn" id="btn-settings-reset">Reset</button>
        <button class="settings-btn primary" id="btn-settings-close">Done</button>
      </div>
      <p class="settings-note">Tab name and icon are applied to this browser tab.</p>
    </div>
  </div>

  <style>
    .gear-btn{background:none;border:none;color:var(--text,#cfd3e6);font-size:20px;cursor:pointer;padding:8px 10px;margin-left:6px;border-radius:8px;transition:background .2s}
    .gear-btn:hover{background:var(--card,rgba(255,255,255,.07))}
    #settings-modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100}
    #settings-modal.hidden{display:none}
    .settings-panel{background:var(--bg,#13141c);border:1px solid var(--border,rgba(255,255,255,.12));border-radius:14px;padding:24px 26px;width:min(420px,92vw);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .settings-panel h2{margin:0 0 16px;font-size:20px}
    .settings-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--border,rgba(255,255,255,.08))}
    .settings-row label{font-size:14px;color:var(--text,#cfd3e6)}
    .settings-row select{background:var(--card,rgba(255,255,255,.07));color:var(--text,#cfd3e6);border:1px solid var(--border,rgba(255,255,255,.15));border-radius:8px;padding:7px 10px;font-size:14px;outline:none}
    .settings-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
    .settings-btn{background:var(--card,rgba(255,255,255,.07));color:var(--text,#cfd3e6);border:1px solid var(--border,rgba(255,255,255,.15));border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer;transition:background .2s}
    .settings-btn:hover{background:rgba(255,255,255,.14)}
    .settings-btn.primary{background:var(--accent,#6d5df6);border-color:var(--accent,#6d5df6);color:#fff}
    .settings-btn.primary:hover{background:#7d6ff7}
    .settings-note{margin:14px 0 0;font-size:12px;color:var(--muted,#8b8fa3)}
  </style>

  <footer class="footer">
    <p>&copy; 2026 Crestview School District - educational resources.</p>
  </footer>

  <script src="/lib/transport.js"></script>
  <script src="/lib/core.js"></script>
  <script src="/lib/settings.js"></script>
  <script src="/config.js"></script>
  <script src="/search.js"></script>
  <script src="/settings.js"></script>
  <script src="/register-sw.js"></script>
  <script src="/main.js"></script>
</body>
</html>
