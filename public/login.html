<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230f121d'/><text x='50' y='72' font-size='62' font-family='Georgia,serif' font-weight='bold' fill='%232dd4bf' text-anchor='middle'>&#960;</text></svg>" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(109, 125, 246, 0.14), transparent 60%),
      radial-gradient(900px 400px at 85% 110%, rgba(45, 212, 191, 0.08), transparent 55%),
      #0a0c14;
    color: #e8eaf0;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .card {
    width: min(380px, 94vw);
    background: rgba(17, 21, 30, 0.9);
    border: 1px solid rgba(148, 163, 184, 0.14);
    border-radius: 16px;
    padding: 34px 30px 30px;
    box-shadow: 0 18px 50px -12px rgba(0, 0, 0, 0.7);
  }
  .mark {
    width: 46px; height: 46px;
    border-radius: 13px;
    background: linear-gradient(135deg, #2dd4bf, #6d7df6);
    display: grid; place-items: center;
    font-size: 24px; font-weight: 800; color: #0a0c14;
    font-family: Georgia, serif;
    margin-bottom: 20px;
  }
  h1 { font-size: 20px; letter-spacing: -0.02em; margin-bottom: 6px; }
  p.sub { font-size: 13px; color: #78808f; margin-bottom: 24px; line-height: 1.5; }
  label { display: block; font-size: 12px; font-weight: 600; color: #a6adbb; margin-bottom: 8px; }
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid rgba(148, 163, 184, 0.26);
    background: #0d1017;
    color: #e8eaf0;
    font-size: 15px;
    letter-spacing: 0.08em;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="password"]:focus {
    border-color: #7a86f8;
    box-shadow: 0 0 0 3px rgba(122, 134, 248, 0.18);
  }
  button {
    width: 100%;
    margin-top: 18px;
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid #545fd4;
    background: #7a86f8;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover { background: #8f9aff; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.6; cursor: default; }
  .err {
    margin-top: 14px;
    font-size: 13px;
    color: #f87171;
    min-height: 18px;
  }
  .hint { margin-top: 20px; font-size: 11.5px; color: #5d6470; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">&pi;</div>
    <h1>Private practice portal</h1>
    <p class="sub">This site is for approved users only. Enter your access code to continue.</p>
    <form id="login-form" autocomplete="off">
      <label for="key">Access code</label>
      <input type="password" id="key" placeholder="Enter your code" autocomplete="off" spellcheck="false" />
      <button type="submit" id="go">Sign in</button>
      <p class="err" id="err"></p>
    </form>
    <p class="hint" id="hint"></p>
  </div>

<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var next = params.get("next") || "/app.html";

    function go() {
      // CDN-proof handoff: bunny.net ignores query strings when caching, so a
      // `?auth=` URL can get served a stale cached copy. The token goes in the
      // PATH instead (/goto/<token>) so the URL is unique and never cached.
      // That route sets the session cookie and redirects to `next`.
      var t = sessionStorage.getItem("ml_token") || "";
      if (t) {
        location.href = "/goto/" + encodeURIComponent(t) + "?next=" + encodeURIComponent(next);
      } else {
        location.href = next;
      }
    }

    // Set the session cookie from JS as well, so the session survives even if
    // a CDN (bunny.net) drops the server's Set-Cookie header. Readable by JS
    // (not HttpOnly) but the value is just the random signed session token.
    function setCookie(token) {
      try {
        document.cookie =
          "ml_session=" + encodeURIComponent(token) +
          "; Path=/; SameSite=Lax; Max-Age=43200";
      } catch (e) {}
    }

    function makeFingerprint() {
      try {
        var parts = [
          navigator.userAgent,
          navigator.platform || "",
          navigator.language || "",
          screen.width + "x" + screen.height,
          screen.colorDepth,
          new Date().getTimezoneOffset(),
          navigator.hardwareConcurrency || "",
          navigator.deviceMemory || "",
          navigator.maxTouchPoints || 0,
          window.devicePixelRatio || 1,
        ];
        var c = document.createElement("canvas");
        var ctx = c.getContext("2d");
        if (ctx) {
          ctx.textBaseline = "top";
          ctx.font = "14px Arial";
          ctx.fillText("arx-fp-1", 2, 2);
          parts.push(c.toDataURL());
        }
        var s = parts.join("|");
        var h = 0;
        for (var i = 0; i < s.length; i++) {
          h = (h * 31 + s.charCodeAt(i)) | 0;
        }
        return "d" + (h >>> 0).toString(16);
      } catch (e) {
        return "d0";
      }
    }

    fetch("/api/auth", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.authed) go();
        document.getElementById("go").disabled = false;
        document.getElementById("key").focus();
      })
      .catch(function () {
        document.getElementById("hint").textContent = "Can't reach the server. Try again later.";
        document.getElementById("go").disabled = false;
      });

    // Send the access code through the same bare proxy the app uses, so the
    // request never appears as a plain `POST /api/login` with the code in the
    // body — to a network filter it's just another encoded `/study/` request.
    // The server whitelists this single self-targeted bare request.
    function sendLogin(key, device) {
      var payload = JSON.stringify({ key: key, device: device });
      return import("/assets/net-client.mjs")
        .then(function (mod) {
          var client = new mod.default(new URL("/study/", location.origin).toString());
          var remote = new URL("/api/login", location.origin);
          return client
            .request(remote, "POST", payload, { "content-type": "application/json" })
            .then(function (res) {
              return new Response(res.body).text().then(function (text) {
                var d = {};
                try { d = JSON.parse(text); } catch (e) {}
                return { status: res.status, d: d };
              });
            });
        })
        .catch(function () {
          // No bare backend on this host (e.g. a static mirror): fall back to
          // a direct request so login still works when nothing is blocking it.
          return fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: payload,
          }).then(function (r) {
            return r.json().then(function (d) { return { status: r.status, d: d }; });
          });
        });
    }

    document.getElementById("go").disabled = true;
    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var key = document.getElementById("key").value.trim();
      var err = document.getElementById("err");
      var btn = document.getElementById("go");
      if (!key) { err.textContent = "Enter your access code."; return; }
      err.textContent = "";
      btn.disabled = true;
      sendLogin(key, makeFingerprint())
        .then(function (res) {
          if (res.status === 200 && res.d && res.d.ok) {
            try { sessionStorage.setItem("ml_token", res.d.token); } catch (e) {}
            setCookie(res.d.token);
            go();
            return;
          }
          err.textContent = (res.d && res.d.error) || "Invalid access code.";
          btn.disabled = false;
          document.getElementById("key").value = "";
          document.getElementById("key").focus();
        })
        .catch(function () {
          err.textContent = "Network error. Try again.";
          btn.disabled = false;
        });
    });
  })();
</script>
</body>
</html>
