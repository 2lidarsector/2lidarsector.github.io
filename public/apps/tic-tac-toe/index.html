<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tic-Tac-Toe - ArcadeX</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: #0b0d1a; color: #e7e9ff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  h1 { font-size: 26px; }
  #status { font-size: 17px; font-weight: 700; color: #34d399; min-height: 24px; }
  #board { display: grid; grid-template-columns: repeat(3, 96px); grid-template-rows: repeat(3, 96px); gap: 8px; }
  .cell { background: #12142a; border: 1px solid #262a52; border-radius: 12px; display: grid; place-items: center; font-size: 52px; font-weight: 800; cursor: pointer; transition: background .12s; }
  .cell:hover { background: #1a1d3e; }
  .cell.x { color: #34d399; } .cell.o { color: #f472b6; }
  .cell.win { background: rgba(52,211,153,.15); border-color: #34d399; }
  button { padding: 10px 22px; border: none; border-radius: 10px; background: linear-gradient(135deg,#34d399,#22c55e); color: #052e16; font-weight: 800; cursor: pointer; }
</style>
</head>
<body>
<h1>Tic-Tac-Toe</h1>
<div id="status">Your turn (X)</div>
<div id="board"></div>
<button id="restart">Restart</button>
<script>
const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");

let board, playerTurn, gameOver;

const winLines = [
  [0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]
];

function reset() {
  board = Array(9).fill(null);
  playerTurn = true;
  gameOver = false;
  statusEl.textContent = "Your turn (X)";
  render();
}

function render() {
  boardEl.innerHTML = "";
  board.forEach((v, i) => {
    const d = document.createElement("div");
    d.className = "cell" + (v ? " " + v.toLowerCase() : "");
    d.textContent = v || "";
    d.addEventListener("click", () => clickCell(i));
    boardEl.appendChild(d);
  });
}

function clickCell(i) {
  if (gameOver || !playerTurn || board[i]) return;
  board[i] = "X";
  if (checkWinner()) return;
  if (board.every(Boolean)) { statusEl.textContent = "Draw!"; gameOver = true; return; }
  playerTurn = false;
  statusEl.textContent = "AI thinking...";
  setTimeout(aiMove, 300);
}

function checkWinner() {
  for (const l of winLines) {
    const [a, b, c] = l;
    if (board[a] && board[a] === board[b] && board[a] === board[c]) {
      gameOver = true;
      statusEl.textContent = board[a] === "X" ? "You win!" : "AI wins!";
      boardEl.querySelectorAll(".cell").forEach((d, i) => { if (l.includes(i)) d.classList.add("win"); });
      return true;
    }
  }
  return false;
}

function aiMove() {
  const i = minimax(board, "O").index;
  board[i] = "O";
  playerTurn = true;
  if (!checkWinner()) {
    statusEl.textContent = board.every(Boolean) ? "Draw!" : "Your turn (X)";
  }
  render();
}

function minimax(b, turn) {
  const lines = winLines;
  for (const l of lines) {
    const [a, c, d] = l;
    if (b[a] && b[a] === b[c] && b[a] === b[d]) return { score: b[a] === "O" ? 10 : -10 };
  }
  if (b.every(Boolean)) return { score: 0 };

  const moves = [];
  b.forEach((v, i) => {
    if (!v) {
      b[i] = turn;
      const r = minimax(b, turn === "O" ? "X" : "O");
      moves.push({ index: i, score: r.score });
      b[i] = null;
    }
  });
  moves.sort((x, y) => turn === "O" ? y.score - x.score : x.score - y.score);
  return moves[0];
}

document.getElementById("restart").addEventListener("click", reset);
reset();
</script>
</body>
</html>
