<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Snake - ArcadeX</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: #0b0d1a; color: #e7e9ff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  h1 { font-size: 26px; }
  .hud { display: flex; gap: 30px; font-size: 15px; color: #8b90c4; }
  .hud b { color: #34d399; }
  canvas { background: #12142a; border: 1px solid #262a52; border-radius: 12px; }
  #over { position: absolute; background: rgba(11,13,26,.92); border-radius: 14px; padding: 28px 40px; text-align: center; display: none; }
  #over h2 { margin-bottom: 8px; color: #f472b6; }
  button { padding: 10px 22px; border: none; border-radius: 10px; background: linear-gradient(135deg,#6d5df6,#f472b6); color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 14px; }
  .keys { color: #8b90c4; font-size: 13px; }
</style>
</head>
<body>
<h1>Snake</h1>
<div class="hud"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
<div style="position: relative">
  <canvas id="c" width="400" height="400"></canvas>
  <div id="over">
    <h2>Game Over</h2>
    <p>Score: <b id="final">0</b></p>
    <button id="restart">Play Again</button>
  </div>
</div>
<p class="keys">Arrow keys / WASD to move. Space to restart.</p>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const overEl = document.getElementById("over");
const finalEl = document.getElementById("final");

const S = 20, N = 20;
let snake, dir, nextDir, food, score, best, dead, tickMs, timer;

best = +localStorage.getItem("snake-best") || 0;
bestEl.textContent = best;

function reset() {
  snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
  dir = { x: 1, y: 0 }; nextDir = { x: 1, y: 0 };
  score = 0; dead = false; tickMs = 130;
  scoreEl.textContent = 0;
  overEl.style.display = "none";
  placeFood();
  clearInterval(timer);
  timer = setInterval(tick, tickMs);
  draw();
}

function placeFood() {
  do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}

function tick() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || snake.some(s => s.x === head.x && s.y === head.y)) {
    return gameOver();
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    if (tickMs > 60) { tickMs -= 3; clearInterval(timer); timer = setInterval(tick, tickMs); }
    placeFood();
  } else snake.pop();
  draw();
}

function gameOver() {
  clearInterval(timer);
  dead = true;
  if (score > best) { best = score; localStorage.setItem("snake-best", best); bestEl.textContent = best; }
  finalEl.textContent = score;
  overEl.style.display = "block";
  draw();
}

function draw() {
  ctx.fillStyle = "#12142a"; ctx.fillRect(0, 0, 400, 400);
  ctx.fillStyle = "#34d399"; ctx.fillRect(food.x * S, food.y * S, S, S);
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? "#6d5df6" : "#4c46a8";
    ctx.fillRect(s.x * S + 1, s.y * S + 1, S - 2, S - 2);
  });
}

window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "arrowup" || k === "arrowdown" || k === "arrowleft" || k === "arrowright" || k === " ") e.preventDefault();
  if (k === "arrowup" || k === "w") nextDir = dir.y ? dir : { x: 0, y: -1 };
  if (k === "arrowdown" || k === "s") nextDir = dir.y ? dir : { x: 0, y: 1 };
  if (k === "arrowleft" || k === "a") nextDir = dir.x ? dir : { x: -1, y: 0 };
  if (k === "arrowright" || k === "d") nextDir = dir.x ? dir : { x: 1, y: 0 };
  if (k === " " && dead) reset();
});

document.getElementById("restart").addEventListener("click", reset);
reset();
</script>
</body>
</html>
