*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0d1a;color:#e7e9ff;font-family:ui-sans-serif,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px}
h1{font-size:24px;text-align:center;margin:12px 0}
.hud{display:flex;gap:24px;justify-content:center;margin-bottom:16px}
.hud span{color:#8b90c4;font-size:14px}
.hud b{color:#34d399;font-weight:bold;font-size:16px}
#board{display:grid;grid-template-columns:repeat(5,54px);gap:6px;margin-bottom:20px}
.cell{width:54px;height:54px;border:2px solid #262a52;background:#1a1f33;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;text-transform:uppercase;color:#e7e9ff}
.cell.filled{border-color:#e7e9ff}
.cell.green{background:#34d399;border-color:#34d399}
.cell.yellow{background:#f59e0b;border-color:#f59e0b}
.cell.gray{background:#3a4158;border-color:#3a4158}
#keyboard{display:flex;flex-direction:column;gap:6px;align-items:center}
.krow{display:flex;gap:6px}
.key{width:44px;height:52px;background:#262a52;color:#e7e9ff;border:none;border-radius:6px;font-size:16px;font-weight:bold;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center}
.key:hover{background:#313a4c}
.key.wide{width:68px;font-size:13px}
.key.green{background:#34d399;border-color:#34d399}
.key.yellow{background:#f59e0b;border-color:#f59e0b}
.key.gray{background:#3a4158;border-color:#3a4158}
#newGame{background:linear-gradient(135deg,#6d5df6,#34d399);color:#fff;font-weight:bold;border:none;border-radius:8px;padding:10px 22px;font-size:15px;cursor:pointer;margin-bottom:16px}
#newGame:hover{opacity:.9}
#overlay{position:fixed;inset:0;background:rgba(11,13,26,.92);display:none;align-items:center;justify-content:center;z-index:50}
#overlay.show{display:flex}
.panel{background:#0b0d1a;border:1px solid #262a52;border-radius:12px;padding:32px 40px;text-align:center;max-width:360px}
.panel h2{color:#f472b6;font-size:22px;margin-bottom:12px}
.panel p{color:#e7e9ff;margin-bottom:20px;font-size:16px}
#playAgain{background:linear-gradient(135deg,#6d5df6,#34d399);color:#fff;font-weight:bold;border:none;border-radius:8px;padding:10px 22px;font-size:15px;cursor:pointer}
#playAgain:hover{opacity:.9}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

","whiff","while","whine","whiny","whirl","whisk","white","whole","whoop","whose","widen","wider","widow","width","wield","wilde","willy","wimpy","wince","winch","windy","wiser","wispy","witch","witty","woken","woman","women","woody","wooer","wooly","woozy","wordy","world","worry","worse","worst","worth","would","wound","woven","wrack","wrath","wreak","wreck","wrest","wring","wrist","write","wrong","wrote","wrung","wryly","yacht","yearn","yeast","yield","young","youth","zebra","zesty","zonal","zoned"]);
var WORDS={};
for(var i=0;i<VALID.length;i++){WORDS[VALID[i]]=true;}
var state={answer:"",current:0,guesses:[],streak:0,fading:false};
function newGame(){
  state.answer=ANSWERS[Math.floor(Math.random()*ANSWERS.length)];
  state.current=0;
  state.guesses=[];
  state.fading=false;
  document.getElementById("board").innerHTML="";
  for(var r=0;r<6;r++){
    for(var c=0;c<5;c++){
      var cell=document.createElement("div");
      cell.className="cell";
      cell.id="cell-"+r+"-"+c;
      document.getElementById("board").appendChild(cell);
    }
  }
  var keys=document.querySelectorAll(".key");
  for(var k=0;k<keys.length;k++){keys[k].className=keys[k].className.replace(/ (green|yellow|gray)/g,"");}
  document.getElementById("attempt").textContent="1/6";
  document.getElementById("overlay").classList.remove("show");
  document.getElementById("streak").textContent=state.streak;
  document.getElementById("currentInput").value="";
  render();
}
function render(){
  var input=document.getElementById("currentInput").value;
  for(var c=0;c<5;c++){
    var cell=document.getElementById("cell-"+state.current+"-"+c);
    var ch=cell.getAttribute("data-char")||"";
    cell.textContent=ch;
    cell.className="cell";
    if(ch){cell.classList.add("filled");}
  }
  for(var c2=0;c2<5;c2++){
    var gcell=document.getElementById("cell-"+state.current+"-"+c2);
    if(c2<input.length){gcell.textContent=input[c2].toUpperCase();gcell.classList.add("filled");}
  }
}
function shake(){
  for(var c=0;c<5;c++){
    var cell=document.getElementById("cell-"+state.current+"-"+c);
    cell.style.animation="none";
    void cell.offsetWidth;
    cell.style.animation="shake .4s ease";
  }
}
function flipRow(){
  return new Promise(function(resolve){
    var answer=state.answer;
    var input=document.getElementById("currentInput").value.toLowerCase();
    var letters=answer.split("");
    var status=["gray","gray","gray","gray","gray"];
    var counts={};
    for(var i=0;i<5;i++){counts[letters[i]]=(counts[letters[i]]||0)+1;}
    for(var i2=0;i2<5;i2++){
      if(input[i2]===answer[i2]){status[i2]="green";counts[letters[i2]]--;}
    }
    for(var i3=0;i3<5;i3++){
      if(status[i3]==="gray"&&counts[input[i3]]>0){status[i3]="yellow";counts[input[i3]]--;}
    }
    var cellEls=[];
    for(var i4=0;i4<5;i4++){
      var el=document.getElementById("cell-"+state.current+"-"+i4);
      el.textContent=input[i4].toUpperCase();
      el.classList.remove("filled");
      cellEls.push(el);
    }
    var col=0;
    var step=function(){
      if(col>=5){resolve();return;}
      var el=cellEls[col];
      el.className="cell "+status[col];
      el.style.transform="rotateX(90deg)";
      setTimeout(function(){
        el.style.transform="";
        colorKey(input[col],status[col]);
        col++;
        setTimeout(step,80);
      },180);
    };
    step();
  });
}
function colorKey(letter,status){
  var el=document.getElementById("key-"+letter);
  if(!el){return;}
  var cur=el.className;
  if(status==="green"){el.className=cur.replace(/ (green|yellow|gray)/g,"")+" green";}
  else if(status==="yellow"){if(!/green/.test(cur)){el.className=cur.replace(/ (yellow|gray)/g,"")+" yellow";}}
  else if(status==="gray"){if(!/green|yellow/.test(cur)){el.className=cur.replace(/ gray/g,"")+" gray";}}
}
function submitGuess(){
  if(state.fading){return;}
  var input=document.getElementById("currentInput").value.toLowerCase();
  if(input.length!==5){shake();return;}
  if(!WORDS[input]){shake();return;}
  state.fading=true;
  flipRow().then(function(){
    state.guesses.push(input);
    document.getElementById("attempt").textContent=(state.current+2)+"/6";
    if(input===state.answer){
      state.streak++;
      localStorage.setItem("arx-word-guess-streak",state.streak);
      document.getElementById("streak").textContent=state.streak;
      showOverlay(true);
    }else if(state.current===5){
      state.streak=0;
      localStorage.setItem("arx-word-guess-streak",0);
      document.getElementById("streak").textContent=0;
      showOverlay(false);
    }else{
      state.current++;
      document.getElementById("currentInput").value="";
      state.fading=false;
      render();
    }
  });
}
function showOverlay(win){
  document.getElementById("overlayTitle").textContent=win?"You got it!":"Out of guesses";
  document.getElementById("overlayMsg").textContent=(win?"Word: ":"The word was ")+state.answer.toUpperCase()+(win?" — solved in "+(state.guesses.length)+" attempt(s).":".");
  document.getElementById("overlay").classList.add("show");
}
function typeLetter(ch){
  if(!/[a-zA-Z]/.test(ch)){return;}
  if(state.fading){return;}
  var input=document.getElementById("currentInput");
  if(input.value.length>=5){return;}
  input.value+=ch.toLowerCase();
  render();
}
function backspace(){
  if(state.fading){return;}
  var input=document.getElementById("currentInput");
  input.value=input.value.slice(0,-1);
  render();
}
function buildKeyboard(){
  var kb=document.getElementById("keyboard");
  kb.innerHTML="";
  var rows=[["q","w","e","r","t","y","u","i","o","p"],["a","s","d","f","g","h","j","k","l"],["z","x","c","v","b","n","m"]];
  for(var r=0;r<rows.length;r++){
    var row=document.createElement("div");
    row.className="krow";
    if(r===1){row.style.marginLeft="12px";}
    if(r===2){var del=document.createElement("button");del.className="key wide";del.textContent="⌫";del.addEventListener("click",backspace);row.appendChild(del);}
    for(var i=0;i<rows[r].length;i++){
      var btn=document.createElement("button");
      btn.className="key";
      btn.id="key-"+rows[r][i];
      btn.textContent=rows[r][i];
      btn.addEventListener("click",(function(l){return function(){typeLetter(l);};})(rows[r][i]));
      row.appendChild(btn);
    }
    if(r===2){var ent=document.createElement("button");ent.className="key wide";ent.textContent="ENTER";ent.addEventListener("click",submitGuess);row.appendChild(ent);}
    kb.appendChild(row);
  }
}
document.getElementById("newGame").addEventListener("click",newGame);
document.getElementById("playAgain").addEventListener("click",newGame);
document.addEventListener("keydown",function(e){
  if(/^[a-zA-Z]$/.test(e.key)){typeLetter(e.key);}
  else if(e.key==="Backspace"){backspace();}
  else if(e.key==="Enter"){submitGuess();}
});
var stored=localStorage.getItem("arx-word-guess-streak");
state.streak=stored?parseInt(stored,10)||0:0;
var ci=document.createElement("input");
ci.type="text";
ci.id="currentInput";
ci.style.position="absolute";
ci.style.opacity="0";
ci.style.pointerEvents="none";
ci.style.left="-9999px";
ci.setAttribute("autocomplete","off");
ci.setAttribute("autocapitalize","off");
ci.setAttribute("spellcheck","false");
document.body.appendChild(ci);
buildKeyboard();
newGame();
</script>
