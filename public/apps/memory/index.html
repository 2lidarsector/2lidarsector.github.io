<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Memory Match - ArcadeX</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: #0b0d1a; color: #e7e9ff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  h1 { font-size: 26px; }
  .hud { display: flex; gap: 34px; font-size: 15px; color: #8b90c4; }
  .hud b { color: #0ea5e9; font-size: 20px; }
  #board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: min(440px, 92vw); }
  .card { aspect-ratio: 1; border-radius: 12px; cursor: pointer; transform-style: preserve-3d; transition: transform .25s; position: relative; }
  .card.flip { transform: rotateY(180deg); }
  .card.matched { opacity: .45; cursor: default; }
  .face { position: absolute; inset: 0; border-radius: 12px; backface-visibility: hidden; display: grid; place-items: center; }
  .back { background: linear-gradient(135deg, #6d5df6, #0ea5e9); }
  .front { background: #12142a; border: 1px solid #262a52; transform: rotateY(180deg); }
  .shape { width: 45%; height: 45%; }
  button { padding: 10px 22px; border: none; border-radius: 10px; background: linear-gradient(135deg,#0ea5e9,#6366f1); color: #fff; font-weight: 800; cursor: pointer; }
  #msg { font-size: 15px; font-weight: 700; color: #f59e0b; min-height: 20px; }
</style>
</head>
<body>
<h1>Memory Match</h1>
<div class="hud"><span>Moves: <b id="moves">0</b></span><span>Pairs: <b id="pairs">0</b>/8</span></div>
<div id="board"></div>
<div id="msg"></div>
<button id="restart">Restart</button>
<script>
const boardEl = document.getElementById("board");
const movesEl = document.getElementById("moves"), pairsEl = document.getElementById("pairs");
const msgEl = document.getElementById("msg");

const shapes = [
  { s: "circle", c: "#34d399" },
  { s: "square", c: "#f472b6" },
  { s: "triangle", c: "#f59e0b" },
  { s: "diamond", c: "#6d5df6" },
  { s: "plus", c: "#0ea5e9" },
  { s: "hexagon", c: "#f87171" },
  { s: "star", c: "#eab308" },
  { s: "ring", c: "#a855f7" },
];

let cards, first, lock, moves, matched;

function makeShape(shape) {
  let clip = "";
  if (shape.s === "triangle") clip = "polygon(50% 0, 100% 100%, 0 100%)";
  if (shape.s === "diamond") clip = "polygon(50% 0, 100% 50%, 50% 100%, 0 50%)";
  if (shape.s === "plus") clip = "polygon(35% 0, 65% 0, 65% 35%, 100% 35%, 100% 65%, 65% 65%, 65% 100%, 35% 100%, 35% 65%, 0 65%, 0 35%, 35% 35%)";
  if (shape.s === "hexagon") clip = "polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%)";
  if (shape.s === "star") clip = "polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)";
  const d = document.createElement("div");
  d.className = "shape";
  d.style.background = shape.s === "ring" ? "transparent" : shape.c;
  d.style.border = shape.s === "ring" ? `6px solid ${shape.c}` : "none";
  d.style.borderRadius = shape.s === "circle" ? "50%" : "0";
  d.style.clipPath = clip;
  return d;
}

function reset() {
  const deck = [...shapes, ...shapes];
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  cards = deck.map((shape, i) => ({ shape, id: i, matched: false }));
  first = null; lock = false; moves = 0; matched = 0;
  movesEl.textContent = 0; pairsEl.textContent = "0/8";
  msgEl.textContent = "";
  render();
}

function render() {
  boardEl.innerHTML = "";
  cards.forEach((card, i) => {
    const d = document.createElement("div");
    d.className = "card";
    d.innerHTML = `<div class="face back"></div><div class="face front"></div>`;
    d.querySelector(".front").appendChild(makeShape(card.shape));
    d.addEventListener("click", () => flip(i));
    card.el = d;
    boardEl.appendChild(d);
  });
}

function flip(i) {
  const card = cards[i];
  if (lock || card.matched || card.el.classList.contains("flip")) return;
  card.el.classList.add("flip");

  if (!first) { first = i; return; }

  moves++;
  movesEl.textContent = moves;

  if (cards[first].shape.s === card.shape.s && first !== i) {
    cards[first].matched = true;
    card.matched = true;
    matched++;
    pairsEl.textContent = matched + "/8";
    cards[first].el.classList.add("matched");
    card.el.classList.add("matched");
    first = null;
    if (matched === 8) msgEl.textContent = "You win in " + moves + " moves!";
  } else {
    lock = true;
    const a = first;
    setTimeout(() => {
      cards[a].el.classList.remove("flip");
      card.el.classList.remove("flip");
      first = null;
      lock = false;
    }, 650);
  }
}

document.getElementById("restart").addEventListener("click", reset);
reset();
</script>
</body>
</html>
