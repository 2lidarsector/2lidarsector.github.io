<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Court Rally</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: #0b0d1a; color: #e7e9ff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  h1 { font-size: 24px; }
  .wrap { position: relative; }
  canvas { border-radius: 14px; background: #0d1022; box-shadow: 0 10px 40px rgba(0,0,0,.5); display: block; }
  #hud { display: flex; gap: 20px; align-items: center; font-size: 14px; font-weight: 700; width: 960px; max-width: 96vw; }
  #hud .p { flex: 1; }
  #hud .p2 { text-align: right; }
  #hud .bar { height: 12px; border-radius: 6px; background: #12142a; border: 1px solid #262a52; overflow: hidden; margin-top: 4px; }
  #hud .bar div { height: 100%; border-radius: 6px; transition: width .15s; }
  #hud .p1 div { background: linear-gradient(90deg,#34d399,#22c55e); }
  #hud .p2 div { background: linear-gradient(90deg,#f472b6,#ef4444); }
  #score { font-size: 18px; color: #f59e0b; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(8,10,24,.88); color: #e7e9ff; z-index: 10; text-align: center; }
  #overlay h1 { font-size: 40px; letter-spacing: 2px; }
  #overlay .keys { color: #aab0d8; line-height: 1.9; font-size: 14px; }
  #overlay .keys b { color: #f59e0b; }
  button { padding: 10px 28px; border: none; border-radius: 10px; background: linear-gradient(135deg,#34d399,#22c55e); color: #052e16; font-weight: 800; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<h1>Court Rally</h1>
<div id="hud">
  <div class="p p1">PLAYER 1 <span id="hp1"></span><div class="bar"><div id="bar1"></div></div></div>
  <div id="score">0 - 0</div>
  <div class="p p2"><span id="hp2"></span> PLAYER 2<div class="bar"><div id="bar2" style="margin-left:auto"></div></div></div>
</div>
<div class="wrap"><canvas id="c" width="960" height="600"></canvas></div>
<div id="overlay">
  <h1>COURT RALLY</h1>
  <div class="keys"><b>P1:</b> WASD move &middot; F shoot &middot; Shift dash<br /><b>P2:</b> Arrow keys move &middot; / shoot &middot; Enter dash</div>
  <div class="keys">First to 5 eliminations wins. Medkits spawn in the arena.</div>
  <button id="start">START</button>
</div>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W = 960, H = 600;
  var walls = [
    { x: 60, y: 60, w: 90, h: 90 },
    { x: 810, y: 60, w: 90, h: 90 },
    { x: 60, y: 450, w: 90, h: 90 },
    { x: 810, y: 450, w: 90, h: 90 },
    { x: 430, y: 255, w: 100, h: 90 }
  ];
  var players, bullets, pickups, parts, running, winner, timer;
  var keys = {};

  function resetGame() {
    players = [
      { x: 180, y: 300, a: 0, hp: 100, kills: 0, cd: 0, dash: 0, inv: 0, lx: 1, ly: 0, color: "#34d399", r: 20 },
      { x: 780, y: 300, a: Math.PI, hp: 100, kills: 0, cd: 0, dash: 0, inv: 0, lx: -1, ly: 0, color: "#f472b6", r: 20 }
    ];
    bullets = [];
    pickups = [];
    parts = [];
    running = true;
    winner = null;
    timer = 0;
    hud();
  }

  function hud() {
    var p1 = players[0], p2 = players[1];
    document.getElementById("hp1").textContent = Math.max(0, Math.round(p1.hp));
    document.getElementById("hp2").textContent = Math.max(0, Math.round(p2.hp));
    document.getElementById("bar1").style.width = Math.max(0, p1.hp) + "%";
    document.getElementById("bar2").style.width = Math.max(0, p2.hp) + "%";
    document.getElementById("score").textContent = p1.kills + " - " + p2.kills;
  }

  document.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    keys[k] = true;
    if (k === "shift" || k === "enter") e.preventDefault();
    if (running && !winner) {
      if (k === "f" && players[0].cd <= 0) { shoot(0); }
      if (k === "/" && players[1].cd <= 0) { shoot(1); }
      if (k === "shift" && players[0].dash <= 0) { dash(0); }
      if (k === "enter" && players[1].dash <= 0) { dash(1); }
    }
  });
  document.addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });

  function shoot(i) {
    var p = players[i];
    var dirx = p.lx, diry = p.ly;
    var bl = Math.hypot(dirx, diry);
    if (bl === 0) { dirx = i === 0 ? 1 : -1; diry = 0; bl = 1; }
    dirx /= bl; diry /= bl;
    p.a = Math.atan2(diry, dirx);
    bullets.push({ x: p.x + dirx * 26, y: p.y + diry * 26, vx: dirx * 560, vy: diry * 560, i: i, life: 1.4 });
    p.cd = 0.24;
    particles(p.x + dirx * 26, p.y + diry * 26, p.color, 4);
  }
  function dash(i) {
    var p = players[i];
    var dx = p.lx, dy = p.ly;
    var bl = Math.hypot(dx, dy);
    if (bl > 0) { dx /= bl; dy /= bl; }
    p.x += dx * 90;
    p.y += dy * 90;
    p.dash = 1.2;
    particles(p.x, p.y, "#ffffff", 8);
  }

  function circleRect(cx, cy, r, w) {
    var wx = Math.max(w.x, Math.min(cx, w.x + w.w));
    var wy = Math.max(w.y, Math.min(cy, w.y + w.h));
    var dx = cx - wx, dy = cy - wy;
    return dx * dx + dy * dy < r * r;
  }
  function collide(p, r) {
    for (var i = 0; i < walls.length; i++) {
      var w = walls[i];
      var cx = Math.max(w.x, Math.min(p.x, w.x + w.w));
      var cy = Math.max(w.y, Math.min(p.y, w.y + w.h));
      var dx = p.x - cx, dy = p.y - cy;
      var d2 = dx * dx + dy * dy;
      if (d2 < r * r) {
        if (d2 > 0.0001) {
          var d = Math.sqrt(d2);
          p.x = cx + (dx / d) * r;
          p.y = cy + (dy / d) * r;
        } else {
          p.x = cx + r;
        }
      }
    }
    p.x = Math.max(r, Math.min(W - r, p.x));
    p.y = Math.max(r, Math.min(H - r, p.y));
  }
  function collidePair(a, b) {
    var dx = b.x - a.x, dy = b.y - a.y;
    var d2 = dx * dx + dy * dy;
    var rr = (a.r + b.r);
    if (d2 < rr * rr && d2 > 0.0001) {
      var d = Math.sqrt(d2);
      var push = (rr - d) / 2;
      a.x -= (dx / d) * push;
      a.y -= (dy / d) * push;
      b.x += (dx / d) * push;
      b.y += (dy / d) * push;
    }
  }
  function particles(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var s = 60 + Math.random() * 160;
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4, color: color });
    }
  }
  function kill(victim, killer) {
    killer.kills++;
    particles(victim.x, victim.y, victim.color, 26);
    hud();
    if (killer.kills >= 5) {
      winner = killer;
      return;
    }
    victim.hp = 100;
    victim.inv = 2;
    victim.x = victim === players[0] ? 180 : 780;
    victim.y = 300;
    victim.cd = 0;
    hud();
  }

  function update(dt) {
    timer += dt;
    if (winner) return;
    var moves = [
      [{ k: "w", x: 0, y: -1 }, { k: "s", x: 0, y: 1 }, { k: "a", x: -1, y: 0 }, { k: "d", x: 1, y: 0 }],
      [{ k: "arrowup", x: 0, y: -1 }, { k: "arrowdown", x: 0, y: 1 }, { k: "arrowleft", x: -1, y: 0 }, { k: "arrowright", x: 1, y: 0 }]
    ];
    for (var i = 0; i < 2; i++) {
      var p = players[i];
      var mx = 0, my = 0;
      for (var j = 0; j < 4; j++) {
        if (keys[moves[i][j].k]) { mx += moves[i][j].x; my += moves[i][j].y; }
      }
      var ml = Math.hypot(mx, my);
      if (ml > 0) {
        mx /= ml; my /= ml;
        p.x += mx * 260 * dt;
        p.y += my * 260 * dt;
        p.lx = mx; p.ly = my;
        p.a = Math.atan2(my, mx);
      }
      collide(p, p.r);
      p.cd = Math.max(0, p.cd - dt);
      p.dash = Math.max(0, p.dash - dt);
      p.inv = Math.max(0, p.inv - dt);
    }
    collidePair(players[0], players[1]);

    for (i = bullets.length - 1; i >= 0; i--) {
      var b = bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      var dead = b.life <= 0 || b.x < 0 || b.x > W || b.y < 0 || b.y > H;
      if (!dead) {
        for (var w = 0; w < walls.length; w++) {
          if (circleRect(b.x, b.y, 5, walls[w])) {
            dead = true;
            particles(b.x, b.y, "#fbbf24", 6);
            break;
          }
        }
      }
      if (!dead) {
        var t = players[1 - b.i];
        if (t.inv <= 0 && Math.hypot(b.x - t.x, b.y - t.y) < t.r + 4) {
          t.hp -= 13;
          particles(b.x, b.y, t.color, 8);
          dead = true;
          if (t.hp <= 0) kill(t, players[b.i]);
          hud();
        }
      }
      if (dead) bullets.splice(i, 1);
    }

    if (timer > 5 && pickups.length < 2) {
      timer = 0;
      pickups.push({ x: 120 + Math.random() * (W - 240), y: 120 + Math.random() * (H - 240), life: 9 });
    }
    for (i = pickups.length - 1; i >= 0; i--) {
      var pk = pickups[i];
      pk.life -= dt;
      if (pk.life <= 0) { pickups.splice(i, 1); continue; }
      for (var q = 0; q < 2; q++) {
        var pp = players[q];
        if (Math.hypot(pk.x - pp.x, pk.y - pp.y) < pp.r + 12) {
          pp.hp = Math.min(100, pp.hp + 25);
          hud();
          particles(pk.x, pk.y, "#4ade80", 10);
          pickups.splice(i, 1);
          break;
        }
      }
    }

    for (i = parts.length - 1; i >= 0; i--) {
      var pt = parts[i];
      pt.life -= dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      if (pt.life <= 0) parts.splice(i, 1);
    }
  }

  function draw() {
    ctx.fillStyle = "#0d1022";
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(255,255,255,.05)";
    ctx.lineWidth = 1;
    for (var gx = 0; gx <= W; gx += 40) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
    for (var gy = 0; gy <= H; gy += 40) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }

    for (var i = 0; i < walls.length; i++) {
      var w = walls[i];
      ctx.fillStyle = "#1c2040";
      ctx.fillRect(w.x, w.y, w.w, w.h);
      ctx.strokeStyle = "#2c3160";
      ctx.lineWidth = 2;
      ctx.strokeRect(w.x, w.y, w.w, w.h);
    }

    for (i = 0; i < pickups.length; i++) {
      var pk = pickups[i];
      var pulse = 0.6 + 0.4 * Math.sin(performance.now() / 200);
      ctx.save();
      ctx.translate(pk.x, pk.y);
      ctx.rotate(performance.now() / 600);
      ctx.fillStyle = "rgba(74,222,128," + pulse + ")";
      ctx.font = "26px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("+", 0, 0);
      ctx.restore();
      ctx.strokeStyle = "rgba(74,222,128,.4)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(pk.x, pk.y, 16 + Math.sin(performance.now() / 200) * 3, 0, Math.PI * 2);
      ctx.stroke();
    }

    for (i = 0; i < bullets.length; i++) {
      var b = bullets[i];
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx));
      ctx.fillStyle = "#fbbf24";
      ctx.shadowColor = "#fbbf24";
      ctx.shadowBlur = 10;
      ctx.fillRect(-10, -3, 20, 6);
      ctx.restore();
    }

    for (i = 0; i < parts.length; i++) {
      var pt = parts[i];
      ctx.globalAlpha = Math.max(0, pt.life / 0.4);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    for (i = 0; i < 2; i++) {
      var p = players[i];
      if (p.inv > 0 && Math.floor(performance.now() / 120) % 2 === 0) {
        ctx.globalAlpha = 0.4;
      }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.a);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 16;
      ctx.fillRect(-16, -14, 32, 28);
      ctx.fillStyle = "#0d1022";
      ctx.fillRect(14, -5, 16, 10);
      ctx.restore();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = "rgba(255,255,255,.35)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r + 4, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (winner) {
      ctx.fillStyle = "rgba(8,10,24,.72)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = winner.color;
      ctx.font = "bold 46px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText((winner === players[0] ? "PLAYER 1" : "PLAYER 2") + " WINS", W / 2, H / 2 - 10);
      ctx.fillStyle = "#aab0d8";
      ctx.font = "18px sans-serif";
      ctx.fillText("Press Play Again to rematch", W / 2, H / 2 + 30);
    }
  }

  var last = 0;
  function loop(t) {
    requestAnimationFrame(loop);
    var dt = Math.min((t - last) / 1000, 0.05);
    last = t;
    update(dt);
    draw();
    document.body.dataset.ready = "1";
  }
  window.addEventListener("error", function (e) { document.body.dataset.error = e.message; });

  document.getElementById("start").addEventListener("click", function () {
    resetGame();
    document.getElementById("overlay").style.display = "none";
  });
  window.rematch = function () {
    resetGame();
    document.getElementById("overlay").style.display = "none";
  };
  document.getElementById("start").addEventListener("dblclick", function () {});
  resetGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
