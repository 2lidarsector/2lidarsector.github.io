<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bounce</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: #0b0d1a; color: #e7e9ff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  h1 { font-size: 24px; }
  canvas { background: #f4f4f0; border: 1px solid #262a52; border-radius: 10px; }
  .hud { display: flex; gap: 26px; font-size: 15px; color: #555; }
  .hud b { color: #16a34a; }
  .keys { color: #8b90c4; font-size: 12.5px; }
  #over { position: absolute; inset: 0; display: none; place-items: center; }
  #over.show { display: grid; }
  .panel { background: rgba(13,17,32,.92); border: 1px solid #262a52; border-radius: 12px; padding: 26px 40px; text-align: center; }
  .panel h2 { color: #f472b6; margin-bottom: 6px; }
  button { margin-top: 14px; padding: 10px 24px; border: 0; border-radius: 8px; background: linear-gradient(135deg,#6d5df6,#34d399); color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<h1>Bounce</h1>
<div class="hud"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
<div style="position: relative">
  <canvas id="c" width="360" height="560"></canvas>
  <div id="over"><div class="panel"><h2>Game Over</h2><p>Score: <b id="final">0</b></p><button id="restart">Play Again</button></div></div>
</div>
<p class="keys">Left/Right (or A/D) to move. Touch: drag the sides.</p>
<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const overEl = document.getElementById("over");
const W = c.width, H = c.height;

let dood, plats, score, over, running, camY, best = 0;
try { best = parseInt(localStorage.getItem("arx-bounce-best") || localStorage.getItem("arx-doodle-best") || "0", 10); } catch (e) {}
bestEl.textContent = best;

const GRAV = 0.28, JUMP = -8.2, MOVE = 4.6;

function makePlat(y) {
  const types = ["#34d399", "#f59e0b", "#f472b6"];
  return { x: Math.random() * (W - 70), y, w: 70, h: 12, t: types[Math.floor(Math.random() * types.length)], dead: Math.random() < 0.12 };
}

function reset() {
  dood = { x: W / 2 - 16, y: H - 90, w: 32, h: 34, vy: 0 };
  plats = [];
  score = 0;
  camY = 0;
  over = false;
  running = true;
  overEl.classList.remove("show");
  scoreEl.textContent = 0;
  for (let i = 0; i < 9; i++) plats.push(makePlat(H - 60 - i * 60));
  plats[0].x = W / 2 - 35;
}

let keys = { left: false, right: false };

function frame() {
  if (!running) return;
  if (keys.left) dood.x -= MOVE;
  if (keys.right) dood.x += MOVE;
  if (dood.x < -40) dood.x = W + 20;
  if (dood.x > W + 40) dood.x = -20;

  dood.vy += GRAV;
  dood.y += dood.vy;

  if (dood.vy > 0) {
    for (const p of plats) {
      if (p.dead) continue;
      if (dood.x + dood.w > p.x && dood.x < p.x + p.w &&
          dood.y + dood.h > p.y && dood.y + dood.h < p.y + p.h + 10) {
        dood.vy = JUMP;
        break;
      }
    }
  }

  if (dood.y < H / 3) {
    const diff = H / 3 - dood.y;
    dood.y += diff;
    camY += diff;
    score = Math.floor(camY / 10);
    scoreEl.textContent = score;
  }

  while (plats[0].y < camY + H) {
    plats.unshift(makePlat(plats[0].y + 60));
  }
  plats = plats.filter(p => p.y > camY - 40);

  if (dood.y > H + 60) gameOver();
  draw();
}

function gameOver() {
  running = false;
  over = true;
  document.getElementById("final").textContent = score;
  overEl.classList.add("show");
  if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem("arx-bounce-best", String(best)); localStorage.removeItem("arx-doodle-best"); } catch (e) {} }
}

function draw() {
  ctx.fillStyle = "#f4f4f0";
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < W; i += 24) { ctx.strokeStyle = "rgba(0,0,0,.05)"; ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke(); }
  for (const p of plats) {
    if (p.y < camY - 10) continue;
    const y = p.y - camY;
    if (p.dead) {
      ctx.fillStyle = "rgba(0,0,0,.12)";
      ctx.fillRect(p.x, y, p.w, p.h);
    } else {
      ctx.fillStyle = p.t;
      ctx.fillRect(p.x, y, p.w, p.h);
      ctx.fillStyle = "rgba(255,255,255,.35)";
      ctx.fillRect(p.x, y, p.w, 4);
    }
  }
  const dy = dood.y - camY;
  ctx.fillStyle = "#f8c14a";
  ctx.fillRect(dood.x, dy, dood.w, dood.h);
  ctx.fillStyle = "#e8a013";
  ctx.beginPath();
  ctx.arc(dood.x + dood.w / 2, dy - 10, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#1a1a1a";
  ctx.beginPath();
  ctx.arc(dood.x + dood.w / 2 - 5, dy - 12, 2, 0, Math.PI * 2);
  ctx.arc(dood.x + dood.w / 2 + 5, dy - 12, 2, 0, Math.PI * 2);
  ctx.fill();
}

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
  if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
});
document.addEventListener("keyup", (e) => {
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
  if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
});
c.addEventListener("touchstart", (e) => {
  e.preventDefault();
  const t = e.touches[0];
  keys.left = t.clientX < c.getBoundingClientRect().left + W / 2;
  keys.right = !keys.left;
});
c.addEventListener("touchend", () => { keys.left = keys.right = false; });
document.getElementById("restart").addEventListener("click", () => { reset(); });

reset();
setInterval(frame, 1000 / 60);
draw();
</script>
</body>
</html>
