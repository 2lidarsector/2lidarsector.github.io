<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flappy Bird</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: #0b0d1a; color: #e7e9ff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  h1 { font-size: 24px; }
  canvas { background: linear-gradient(180deg,#0e2233,#123b4a); border: 1px solid #262a52; border-radius: 10px; cursor: pointer; }
  .hud { display: flex; gap: 26px; font-size: 15px; color: #8b90c4; }
  .hud b { color: #34d399; }
  .keys { color: #8b90c4; font-size: 12.5px; }
  #over { position: absolute; inset: 0; display: none; place-items: center; }
  #over.show { display: grid; }
  .panel { background: rgba(13,17,32,.92); border: 1px solid #262a52; border-radius: 12px; padding: 26px 40px; text-align: center; }
  .panel h2 { color: #f472b6; margin-bottom: 6px; }
  button { margin-top: 14px; padding: 10px 24px; border: 0; border-radius: 8px; background: linear-gradient(135deg,#6d5df6,#34d399); color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<h1>Flappy Bird</h1>
<div class="hud"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
<div style="position: relative">
  <canvas id="c" width="420" height="560"></canvas>
  <div id="over"><div class="panel"><h2>Game Over</h2><p>Score: <b id="final">0</b></p><button id="restart">Play Again</button></div></div>
</div>
<p class="keys">Click or press Space to flap</p>
<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const overEl = document.getElementById("over");
const W = c.width, H = c.height;

let bird, pipes, score, over, running, best = 0;
try { best = parseInt(localStorage.getItem("arx-flappy-best") || "0", 10); } catch (e) {}
bestEl.textContent = best;

const GRAV = 0.42, FLAP = -7.2, PIPE_W = 64, GAP = 150, SPACING = 220;

function reset() {
  bird = { x: 90, y: H / 2, vy: 0, r: 13 };
  pipes = [];
  score = 0;
  over = false;
  running = true;
  overEl.classList.remove("show");
  scoreEl.textContent = 0;
}

function flap() {
  if (!running) return;
  bird.vy = FLAP;
}

function frame() {
  if (!running) return;
  bird.vy += GRAV;
  bird.y += bird.vy;
  if (pipes.length === 0 || pipes[pipes.length - 1].x < W - SPACING) {
    const top = 60 + Math.random() * (H - GAP - 160);
    pipes.push({ x: W, top, scored: false });
  }
  for (let i = pipes.length - 1; i >= 0; i--) {
    const p = pipes[i];
    p.x -= 2.6;
    if (!p.scored && p.x + PIPE_W < bird.x) { p.scored = true; score++; scoreEl.textContent = score; }
    if (p.x < -PIPE_W) pipes.splice(i, 1);
    if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W) {
      if (bird.y - bird.r < p.top || bird.y + bird.r > p.top + GAP) { gameOver(); return; }
    }
  }
  if (bird.y + bird.r > H || bird.y - bird.r < 0) { gameOver(); return; }
  draw();
}

function gameOver() {
  running = false;
  over = true;
  document.getElementById("final").textContent = score;
  overEl.classList.add("show");
  if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem("arx-flappy-best", String(best)); } catch (e) {} }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "rgba(255,255,255,.04)";
  for (let i = 0; i < W; i += 60) ctx.fillRect(i, 0, 2, H);
  for (const p of pipes) {
    ctx.fillStyle = "#1d9a5c";
    ctx.fillRect(p.x, 0, PIPE_W, p.top);
    ctx.fillRect(p.x, p.top + GAP, PIPE_W, H - p.top - GAP);
    ctx.fillStyle = "#26c06f";
    ctx.fillRect(p.x - 4, p.top - 22, PIPE_W + 8, 22);
    ctx.fillRect(p.x - 4, p.top + GAP, PIPE_W + 8, 22);
  }
  ctx.fillStyle = "#facc15";
  ctx.beginPath();
  ctx.arc(bird.x, bird.y, bird.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(bird.x + 6, bird.y - 4, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#f97316";
  ctx.beginPath();
  ctx.moveTo(bird.x + bird.r - 2, bird.y);
  ctx.lineTo(bird.x + bird.r + 12, bird.y - 4);
  ctx.lineTo(bird.x + bird.r + 12, bird.y + 4);
  ctx.closePath();
  ctx.fill();
}

c.addEventListener("click", flap);
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.key === " ") { e.preventDefault(); flap(); }
});
document.getElementById("restart").addEventListener("click", () => { reset(); });

reset();
setInterval(frame, 1000 / 60);
draw();
</script>
</body>
</html>
