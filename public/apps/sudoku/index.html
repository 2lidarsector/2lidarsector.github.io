<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0b0d1a;color:#e7e9ff;font-family:'Segoe UI',system-ui,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px;}
h1{font-size:24px;text-align:center;margin-bottom:12px;}
.hud{display:flex;gap:28px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;}
.hud .item{display:flex;flex-direction:column;align-items:center;gap:2px;}
.hud .label{font-size:11px;color:#8b90c4;text-transform:uppercase;letter-spacing:1px;}
.hud .value{font-size:18px;font-weight:700;color:#34d399;}
.board{display:grid;grid-template-columns:repeat(9,44px);grid-template-rows:repeat(9,44px);border:2px solid #6d7df6;border-radius:4px;overflow:hidden;background:#0b0d1a;}
.cell{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid #262a52;cursor:pointer;user-select:none;background:#0b0d1a;line-height:1;}
.cell.rb{border-right:2px solid #6d7df6;}
.cell.bb{border-bottom:2px solid #6d7df6;}
.cell.lb{border-left:2px solid #6d7df6;}
.cell.tb{border-top:2px solid #6d7df6;}
.cell.hl{background:#262a52;}
.cell.sel{background:#3b4180;}
.cell.given{color:#e7e9ff;font-weight:700;}
.cell.user{color:#34d399;font-weight:600;}
.cell.err{color:#f87171 !important;}
.pad{display:grid;grid-template-columns:repeat(5,44px);gap:8px;margin-top:18px;}
.pad button{height:44px;font-size:18px;font-weight:700;color:#e7e9ff;background:#1b2040;border:1px solid #262a52;border-radius:8px;cursor:pointer;}
.pad button:hover{background:#262a52;}
.pad button.clear{color:#f87171;}
.buttons{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;justify-content:center;}
.buttons button{padding:10px 20px;font-size:15px;font-weight:700;color:#fff;border:none;border-radius:8px;background:linear-gradient(135deg,#6d5df6,#34d399);cursor:pointer;}
.buttons button:hover{filter:brightness(1.15);}
.overlay{position:fixed;inset:0;background:rgba(11,13,26,.92);display:none;align-items:center;justify-content:center;z-index:10;}
.overlay.show{display:flex;}
.panel{background:#0b0d1a;border:1px solid #262a52;border-radius:12px;padding:36px 48px;text-align:center;}
.panel h2{font-size:26px;color:#f472b6;margin-bottom:20px;}
.panel p{color:#8b90c4;margin-bottom:20px;font-size:14px;}
.panel button{padding:10px 24px;font-size:15px;font-weight:700;color:#fff;border:none;border-radius:8px;background:linear-gradient(135deg,#6d5df6,#34d399);cursor:pointer;}
</style>
</head>
<body>
<h1>Sudoku</h1>
<div class="hud">
  <div class="item"><span class="label">Time</span><span class="value" id="time">00:00</span></div>
  <div class="item"><span class="label">Best</span><span class="value" id="best">--:--</span></div>
  <div class="item"><span class="label">Puzzle</span><span class="value" id="pnum">1/3</span></div>
</div>
<div class="board" id="board"></div>
<div class="pad" id="pad"></div>
<div class="buttons">
  <button id="newGame">New Game</button>
  <button id="check">Check</button>
  <button id="hint">Hint</button>
</div>
<div class="overlay" id="overlay">
  <div class="panel">
    <h2>Puzzle complete!</h2>
    <p id="finalInfo"></p>
    <button id="again">New Game</button>
  </div>
</div>
<script>
(function(){
var PUZZLES=[
{sol:[1,2,3,7,8,9,4,5,6,4,5,6,1,2,3,7,8,9,7,8,9,4,5,6,1,2,3,5,6,7,2,3,4,8,9,1,8,9,1,5,6,7,2,3,4,2,3,4,8,9,1,5,6,7,9,1,2,6,7,8,3,4,5,3,4,5,9,1,2,6,7,8,6,7,8,3,4,5,9,1,2],
given:[0,0,0,0,8,9,4,0,6,0,0,0,1,0,3,7,0,0,0,8,0,0,5,0,1,0,3,0,6,0,2,3,0,8,0,1,8,0,0,5,0,0,0,0,4,2,0,4,0,0,0,0,6,7,0,1,2,6,0,8,3,4,0,0,0,0,9,1,2,6,7,8,6,7,8,0,4,5,9,1,0]},
{sol:[2,8,1,7,6,4,9,5,3,6,4,7,5,3,9,1,2,8,9,5,3,8,1,2,6,4,7,1,2,8,4,7,6,3,9,5,7,6,4,9,5,3,8,1,2,3,9,5,2,8,1,7,6,4,8,1,2,6,4,7,5,3,9,4,7,6,3,9,5,2,8,1,5,3,9,1,2,8,4,7,6],
given:[0,0,0,0,0,0,9,0,0,0,4,7,0,0,0,0,0,8,9,5,3,0,0,2,0,4,0,0,0,8,4,0,0,3,9,5,7,6,4,9,5,0,0,1,2,3,9,0,2,0,0,0,6,0,0,1,0,6,0,7,0,3,9,0,7,6,3,9,5,0,8,0,5,3,9,1,0,8,0,0,6]},
{sol:[9,1,6,8,5,2,3,4,7,5,2,8,4,7,3,9,1,6,3,4,7,6,9,1,2,8,5,6,9,1,2,8,5,7,3,4,8,5,2,3,4,7,6,9,1,7,3,4,1,6,9,5,2,8,1,6,9,5,2,8,4,7,3,2,8,5,7,3,4,1,6,9,4,7,3,9,1,6,8,5,2],
given:[9,1,6,8,0,0,0,0,0,0,0,8,4,0,0,0,1,0,0,0,0,0,9,0,2,8,5,0,0,0,2,0,0,7,0,0,0,0,0,3,0,0,0,0,1,0,3,4,0,6,9,0,2,8,0,6,9,5,2,8,4,7,3,2,0,5,7,3,0,1,6,9,0,7,0,9,1,6,8,5,0]}
];
var BEST_KEY='arx-sudoku-best';
var board=document.getElementById('board');
var timeEl=document.getElementById('time');
var bestEl=document.getElementById('best');
var pnumEl=document.getElementById('pnum');
var overlay=document.getElementById('overlay');
var finalInfo=document.getElementById('finalInfo');
var pad=document.getElementById('pad');
var cells=[];
var grid=[];var fixed=[];var idx=0;var sel=null;
var start=0;var elapsed=0;var timer=null;var done=false;
function initGrid(){
  grid=[];fixed=[];
  var g=PUZZLES[idx].given;
  for(var r=0;r<9;r++){grid.push([]);fixed.push([]);
    for(var c=0;c<9;c++){var v=g[r*9+c];grid[r].push(v);fixed[r].push(v!==0);}}
}
function render(){
  board.innerHTML='';
  cells=[];
  for(var r=0;r<9;r++){
    for(var c=0;c<9;c++){
      var d=document.createElement('div');
      d.className='cell';
      if(c%3===2)d.classList.add('rb');
      if(r%3===2)d.classList.add('bb');
      if(c%3===0)d.classList.add('lb');
      if(r%3===0)d.classList.add('tb');
      if(fixed[r][c]){d.classList.add('given');d.textContent=grid[r][c];}
      else if(grid[r][c]>0){d.classList.add('user');d.textContent=grid[r][c];}
      d.addEventListener('click',(function(rr,cc){return function(){select(rr,cc);};})(r,c));
      board.appendChild(d);
      cells.push(d);
    }
  }
  refreshHighlights();
}
function refreshHighlights(){
  for(var i=0;i<81;i++){
    var r=Math.floor(i/9),c=i%9;
    var d=cells[i];
    d.classList.remove('hl','sel','err');
    if(sel&&(r===sel.r||c===sel.c||(Math.floor(r/3)===Math.floor(sel.r/3)&&Math.floor(c/3)===Math.floor(sel.c/3)))){
      d.classList.add('hl');
    }
    if(sel&&r===sel.r&&c===sel.c)d.classList.add('sel');
    if(!fixed[r][c]&&grid[r][c]>0&&conflict(r,c))d.classList.add('err');
  }
}
function conflict(r,c){
  var v=grid[r][c];
  for(var k=0;k<9;k++){
    if(k!==c&&grid[r][k]===v)return true;
    if(k!==r&&grid[k][c]===v)return true;
  }
  var br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;
  for(var rr=br;rr<br+3;rr++)for(var cc=bc;cc<bc+3;cc++){
    if((rr!==r||cc!==c)&&grid[rr][cc]===v)return true;
  }
  return false;
}
function select(r,c){sel={r:r,c:c};refreshHighlights();}
function setValue(r,c,v){
  if(done)return;
  if(fixed[r][c])return;
  grid[r][c]=v;
  refreshHighlights();
}
function inputNumber(n){
  if(!sel)return;
  setValue(sel.r,sel.c,n);
}
function clearSelected(){
  if(!sel)return;
  setValue(sel.r,sel.c,0);
}
function startTimer(){
  clearInterval(timer);
  start=Date.now();
  elapsed=0;
  timer=setInterval(function(){elapsed=Math.floor((Date.now()-start)/1000);timeEl.textContent=fmt(elapsed);},250);
}
function fmt(s){var m=Math.floor(s/60),ss=s%60;return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;}
function remaining(){var n=0;for(var r=0;r<9;r++)for(var c=0;c<9;c++)if(grid[r][c]===0)n++;return n;}
function solved(){
  var sol=PUZZLES[idx].sol;
  for(var r=0;r<9;r++)for(var c=0;c<9;c++)if(grid[r][c]!==sol[r*9+c])return false;
  return true;
}
function showBest(){
  var bests={};try{bests=JSON.parse(localStorage.getItem(BEST_KEY))||{};}catch(e){bests={};}
  if(bests[idx]!==undefined)bestEl.textContent=fmt(bests[idx]);else bestEl.textContent='--:--';
}
function saveBest(t){
  var bests={};try{bests=JSON.parse(localStorage.getItem(BEST_KEY))||{};}catch(e){bests={};}
  if(bests[idx]===undefined||t<bests[idx]){bests[idx]=t;localStorage.setItem(BEST_KEY,JSON.stringify(bests));}
}
function newGame(){
  initGrid();
  sel=null;
  done=false;
  render();
  startTimer();
  pnumEl.textContent=(idx+1)+'/3';
  showBest();
  overlay.classList.remove('show');
}
function check(){
  if(solved()){
    clearInterval(timer);
    done=true;
    var t=Math.floor((Date.now()-start)/1000);
    saveBest(t);
    var prev=null;try{prev=(JSON.parse(localStorage.getItem(BEST_KEY))||{})[idx];}catch(e){prev=null;}
    finalInfo.textContent='Time '+fmt(t)+(prev!==undefined&&t===prev?' (new best!)':'');
    showBest();
    overlay.classList.add('show');
  }else{
    alert(remaining()+' cells to go');
  }
}
function hint(){
  if(done)return;
  var sol=PUZZLES[idx].sol;
  var target=null;
  if(sel&&!fixed[sel.r][sel.c]&&grid[sel.r][sel.c]===0)target={r:sel.r,c:sel.c};
  if(!target){
    for(var r=0;r<9&&!target;r++)for(var c=0;c<9;c++){
      if(!fixed[r][c]&&grid[r][c]===0){target={r:r,c:c};break;}
    }
  }
  if(!target)return;
  grid[target.r][target.c]=sol[target.r*9+target.c];
  refreshHighlights();
}
document.addEventListener('keydown',function(e){
  var k=e.key;
  if(k>='1'&&k<='9'){inputNumber(parseInt(k,10));}
  else if(k==='Backspace'||k==='Delete'||k==='0'){clearSelected();}
});
(function buildPad(){
  for(var i=1;i<=9;i++){
    var b=document.createElement('button');
    b.textContent=i;
    b.addEventListener('click',(function(n){return function(){inputNumber(n);};})(i));
    pad.appendChild(b);
  }
  var c=document.createElement('button');
  c.textContent='C';
  c.classList.add('clear');
  c.addEventListener('click',clearSelected);
  pad.appendChild(c);
})();
document.getElementById('newGame').addEventListener('click',function(){idx=(idx+1)%PUZZLES.length;newGame();});
document.getElementById('check').addEventListener('click',check);
document.getElementById('hint').addEventListener('click',hint);
document.getElementById('again').addEventListener('click',function(){idx=(idx+1)%PUZZLES.length;newGame();});
newGame();
})();
</script>
</body>
</html>
