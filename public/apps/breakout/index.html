<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Breakout</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: #0b0d1a; color: #e7e9ff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  h1 { font-size: 26px; }
  .hud { display: flex; gap: 34px; font-size: 15px; color: #8b90c4; }
  .hud b { color: #f472b6; font-size: 20px; }
  canvas { background: #12142a; border: 1px solid #262a52; border-radius: 12px; cursor: none; }
  button { padding: 10px 22px; border: none; border-radius: 10px; background: linear-gradient(135deg,#f472b6,#f59e0b); color: #fff; font-weight: 700; cursor: pointer; }
  .keys { color: #8b90c4; font-size: 13px; }
</style>
</head>
<body>
<h1>Breakout</h1>
<div class="hud"><span>Score: <b id="score">0</b></span><span>Lives: <b id="lives">3</b></span><span id="msg" style="color:#f59e0b">Click to start</span></div>
<canvas id="c" width="640" height="480"></canvas>
<button id="restart" style="display:none">Play Again</button>
<p class="keys">Move with mouse or arrow keys.</p>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score"), livesEl = document.getElementById("lives");
const msgEl = document.getElementById("msg"), restartBtn = document.getElementById("restart");

const W = 640, H = 480;
const COLS = 8, ROWS = 5;
const BW = 64, BH = 20, TOP = 60, GAP = 8;
const colors = ["#f472b6", "#f59e0b", "#34d399", "#6d5df6", "#f87171"];

let paddle, ball, bricks, score, lives, state, raf;

function reset() {
  paddle = { x: W / 2 - 55, y: H - 34, w: 110 };
  bricks = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    bricks.push({ x: GAP + c * (BW + GAP), y: TOP + r * (BH + GAP), w: BW, h: BH, alive: true, color: colors[r] });
  }
  score = 0; lives = 3; state = "serve";
  scoreEl.textContent = 0; livesEl.textContent = 3;
  msgEl.textContent = "Click to start";
  restartBtn.style.display = "none";
  serve();
}

function serve() {
  ball = { x: paddle.x + paddle.w / 2, y: paddle.y - 10, vx: 3.2, vy: -4.2 };
  state = "serve";
  draw();
}

function launch() {
  state = "play";
  msgEl.textContent = "";
}

function step() {
  const prevPx = paddle.x;
  if (keys["arrowleft"]) paddle.x -= 8;
  if (keys["arrowright"]) paddle.x += 8;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  if (state === "serve") { ball.x = paddle.x + paddle.w / 2; ball.y = paddle.y - 10; }

  ball.x += ball.vx; ball.y += ball.vy;

  if (ball.x < 8 || ball.x > W - 8) ball.vx = -ball.vx;
  if (ball.y < 8) ball.vy = -ball.vy;

  if (ball.y > paddle.y - 8 && ball.y < paddle.y + 8 && ball.x > paddle.x - 6 && ball.x < paddle.x + paddle.w + 6 && ball.vy > 0) {
    const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
    const angle = hit * 0.9;
    const speed = Math.min(Math.hypot(ball.vx, ball.vy) + 0.25, 9);
    ball.vx = Math.sin(angle) * speed;
    ball.vy = -Math.cos(angle) * speed;
    ball.y = paddle.y - 9;
  }

  for (const b of bricks) {
    if (!b.alive) continue;
    if (ball.x > b.x - 6 && ball.x < b.x + b.w + 6 && ball.y > b.y - 6 && ball.y < b.y + b.h + 6) {
      b.alive = false;
      score += 10;
      scoreEl.textContent = score;
      const overlapX = ball.x - Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const overlapY = ball.y - Math.max(b.y, Math.min(ball.y, b.y + b.h));
      if (Math.abs(overlapX) > Math.abs(overlapY)) ball.vx = -ball.vx;
      else ball.vy = -ball.vy;
      if (bricks.every(x => !x.alive)) { state = "won"; msgEl.textContent = "You win!"; restartBtn.style.display = "inline-block"; cancelAnimationFrame(raf); return; }
    }
  }

  if (ball.y > H + 20) {
    lives--;
    livesEl.textContent = lives;
    if (lives <= 0) { state = "over"; msgEl.textContent = "Game Over"; restartBtn.style.display = "inline-block"; cancelAnimationFrame(raf); return; }
    serve();
  }

  draw();
}

function draw() {
  ctx.fillStyle = "#12142a"; ctx.fillRect(0, 0, W, H);
  bricks.forEach(b => { if (b.alive) { ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, b.w, b.h); } });
  ctx.fillStyle = "#e7e9ff"; ctx.fillRect(paddle.x, paddle.y, paddle.w, 12);
  ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(ball.x, ball.y, 8, 0, Math.PI * 2); ctx.fill();
}

const keys = {};
window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
canvas.addEventListener("mousemove", e => {
  const r = canvas.getBoundingClientRect();
  paddle.x = (e.clientX - r.left) * (W / r.width) - paddle.w / 2;
  if (state === "play") paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
});
canvas.addEventListener("click", () => { if (state === "serve") launch(); });

function loop() { raf = requestAnimationFrame(loop); step(); }
document.getElementById("restart").addEventListener("click", () => { reset(); loop(); });
reset(); loop();
</script>
</body>
</html>
